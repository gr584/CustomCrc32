name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant, except on main
# where every commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: windows-latest, name: Windows x64 }
          # arm64 has neither PCLMULQDQ nor SSSE3, so this leg is what exercises
          # the table fallback in Crc32 and proves both paths agree.
          - { os: ubuntu-24.04-arm, name: Linux arm64 }

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # Both are needed. 10.0 understands the .slnx solution format, builds the
          # benchmark project and runs the net10.0 test leg; 8.0 supplies the runtime
          # the net8.0 test leg's host needs, which will not roll forward on its own.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CustomCrc32.slnx

      - name: Build
        run: dotnet build CustomCrc32.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test CustomCrc32.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        # Failures are exactly when the .trx file is most worth having.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
